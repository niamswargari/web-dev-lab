</head>
    <body>
        <form onsubmit="return validateForm()">
            <label for="txtInput">Please enter your name to continue:</label><br>
            <input type="text" id="name" onfocus="myfocus(this)" onchange="upperCase()" placeholder="Type your name"><br><br>
            <input type="submit" value="Submit">
        </form>
        <script>
            function myfocus(x){
                x.style.background = "yellow";
            }
            function upperCase(){
                const x = document.getElementById("name");
                x.value = x.value.toUpperCase();
            }
            function validateForm() {
                let name = document.getElementById('name').value;
                if (name === "") {
                    alert("Name cannot be empty");
                    return false;
                }
                return true;
            }SS
        </script>
    </body>
</html>
