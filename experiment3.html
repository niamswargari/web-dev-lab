<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Experiment 3: HTML Forms, Media and Embedding</title>
<style>
  img { max-width: 100%; height: auto; }
  .container { display: flex; gap: 10px; }
  .box { flex: 1; background: #ddd; padding: 10px; }
  @media (max-width: 600px) {
    .container { flex-direction: column; }
    body { background: yellow; }
  }
</style>
</head>
<body>

<h2>1. Form</h2>
<form>
  Name: <input type="text" required><br><br>
  Email: <input type="email" required><br><br>
  Password: <input type="password"><br><br>
  Age: <input type="number" min="18" max="60"><br><br>
  DOB: <input type="date"><br><br>
  Gender:
  <input type="radio" name="g"> Male
  <input type="radio" name="g"> Female<br><br>
  Hobbies:
  <input type="checkbox"> Reading
  <input type="checkbox"> Coding<br><br>
  Course:
  <select>
    <option>CSE</option>
    <option>IT</option>
  </select><br><br>
  Comments:<br>
  <textarea rows="3" cols="30"></textarea><br><br>
  <input type="submit"> <input type="reset">
</form>

<h2>2. Image and iframe</h2>
<img src="https://picsum.photos/600/300" alt="Sample image">
<br><br>
<iframe 
src="https://www.youtube.com/embed/dQw4w9WgXcQ" 
width="560" 
height="315" 
frameborder="0" 
allowfullscreen 
allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>

<h2>3. Media query</h2>
<p>Resize the window below 600px: boxes stack and background turns yellow.</p>
<div class="container">
  <div class="box">Box 1</div>
  <div class="box">Box 2</div>
  <div class="box">Box 3</div>
</div>

</body>
</html>
